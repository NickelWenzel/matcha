[workspace]
resolver = "2"
members = ["crates/matcha-core", "crates/matcha-lsp", "crates/matcha-iced"]

# Shared metadata.
[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NickelWenzel/matcha"

# The internal crates, declared once. A release bump edits the `version`s here
# and nowhere else; each member opts in with `<crate>.workspace = true`.
# matcha-core's highlight backends are features, and a member can't turn off a
# workspace dependency's defaults, so the entry turns them off and each member
# enables the backends it needs.
[workspace.dependencies]
matcha-core = { path = "crates/matcha-core", version = "0.4.0", default-features = false }
matcha-lsp = { path = "crates/matcha-lsp", version = "0.4.0" }

# Track iced's git master. The requirements in matcha-iced are `0.15.0-dev`
# to match it; the dev-dep sub-crates are patched to the same source so their
# types unify with the ones `iced` re-exports.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_renderer = { git = "https://github.com/iced-rs/iced", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_tiny_skia = { git = "https://github.com/iced-rs/iced", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
