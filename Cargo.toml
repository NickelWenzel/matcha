[package]
name = "matcha"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "A code editor widget for iced with diagnostics, inlay hints, and a line-number gutter"
repository = "https://github.com/NickelWenzel/matcha"

# Without this, docs.rs renders none of the feature-gated modules, which is all
# of the LSP bridge.
[package.metadata.docs.rs]
all-features = true

# The LSP bridge is optional and additive. `lsp` itself pulls in nothing: the
# application hands over values it has already decoded, so nothing here
# deserializes and the feature costs no dependency at all. What it gates is API
# surface, which is the honest reason rather than dependency weight.
[features]
lsp = []
lsp-types = ["lsp", "dep:lsp-types"]
gen-lsp-types = ["lsp", "dep:gen-lsp-types"]

# A renderer backend (`wgpu` or `tiny-skia`, both default) is mandatory: without one
# `iced_renderer::Renderer` resolves to `()`, whose `text::Renderer::Editor` is also `()`,
# and the widget's `Renderer::Editor = graphics::text::Editor` bound stops typechecking.
[dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "fa3bae52874274c012a27d4bf11a83c49e1709ae", features = [
    "advanced",
    "highlighter",
] }

# A range, not a pin, and the range is the point. This crate has been frozen at
# 0.97 since 2024, while `async-lsp` -- the obvious transport for an iced
# application -- asks for ^0.95. Cargo reads a 0.x minor as a major, so those
# two are disjoint: pinning either hands an application a second copy of the
# types and nothing that unifies with it. A range lets Cargo settle on whatever
# is already in the graph.
#
# Every struct read here is identical across the range, and one source builds
# against all three versions. Two rules keep that true: read a URI with
# `as_str`, and match a severity on its associated constants. Both are spelled
# out in `src/code_editor/lsp/from_lsp_types.rs`.
lsp-types = { version = ">=0.95, <0.98", optional = true }

# A range for the opposite reason: this crate is alive and moves quickly --
# 0.5 to 0.11 in five months -- so a pin would make matcha ship a breaking
# release every time it does. Every struct read here is identical across the
# range. The rule that keeps it that way is to read an integer enum through
# `u32`: 0.11 added a catch-all variant that 0.9 and 0.10 have no shape for, so
# an exhaustive match builds at one end and not the other.
gen-lsp-types = { version = ">=0.9, <0.12", optional = true }

# `fira-sans` embeds a known font so shaped-geometry assertions do not depend on whatever
# fonts the host machine happens to have. `iced_test` must come from the same git rev as
# `iced`; a crates.io build would pull its own `iced_core` and the `Element`/`Renderer`
# types would not unify.
[dev-dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "fa3bae52874274c012a27d4bf11a83c49e1709ae", features = [
    "advanced",
    "highlighter",
    "fira-sans",
] }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "fa3bae52874274c012a27d4bf11a83c49e1709ae" }
