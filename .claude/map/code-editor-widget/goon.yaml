# Project configuration for /goon and /handoff.
# Generated by /map. Update as the project evolves.

project: matcha
description: A code editor widget for iced with diagnostic squiggles, inlay-hint overlays, and a line-number gutter.

# GitHub
repo: NickelWenzel/matcha
milestone: none # no milestones or issues created yet — see "project tracking" below
default_branch: master

handoff:
  dir: .claude/map/code-editor-widget
  prefix: SESSION_HANDOFF

# Single library crate, deliberately not a workspace: matcha's logic *is* text
# geometry over cosmic_text::Buffer, so there is no iced-free layer to extract
# into a `core` crate. No [workspace] table, hence no members/architecture here.
crate:
  name: matcha
  path: "."
  role: "library — the CodeEditor widget"
  edition: "2024"
  rust_version: "1.93"

# Pinned upstream. iced 0.15 is unpublished and its text/editor APIs are moving
# fast — the local checkout advanced ~250 commits during planning alone. The rev
# is the contract; the local checkout is only a reading reference.
upstream:
  iced_rev: fa3bae52874274c012a27d4bf11a83c49e1709ae
  iced_checkout: /home/nickel/Programming/repos/iced
  cosmic_text: "hecrj fork, 0.19.0, rev 1cdc3e0fcda67e38946db57df777181e4569d7c0"
  note: >-
    Reach cosmic-text only through iced::advanced::graphics::text::cosmic_text.
    A crates.io cosmic-text is a different crate instance and its types will not
    unify with iced's.

checklist:
  # Before Phase 1 there is no Cargo.toml and every cargo command fails.
  # That is the expected bare-repo state, not a regression.
  quick:
    - cargo test
  verify:
    - cargo test
    - cargo doc --no-deps
  lint:
    - cargo clippy --all-targets -- -D warnings
    - cargo fmt --all -- --check

# Commands an agent must NOT run unattended.
forbidden:
  - command: cargo run --example <name>
    reason: opens a GUI window and hangs a headless session — visual verification is the human's step
  - command: cargo test -- --ignored
    reason: >-
      pixel snapshots auto-create their golden file on first run and return true,
      so a stray run silently bakes in a wrong baseline
  - command: cargo update / editing the pinned iced rev
    reason: the pin is the contract; upgrades are a deliberate, reviewed step

# Read in this order at session start.
key_files:
  - .claude/map/code-editor-widget/SESSION_HANDOFF.md
  - .claude/map/code-editor-widget/MAP_PLAN.md
  - src/lib.rs
  - src/code_editor/widget.rs
  - src/code_editor/geometry.rs
  - src/code_editor/content.rs
  # Upstream reference — ground truth, read rather than recalled
  - /home/nickel/Programming/repos/iced/widget/src/text_editor.rs
  - /home/nickel/Programming/repos/iced/core/src/text/editor.rs
  - /home/nickel/Programming/repos/iced/graphics/src/text/editor.rs

examples:
  - command: cargo run --example showcase
    description: static decorations over wrapped, multibyte text — the visual smoke test
  - command: cargo run --example live
    description: decorations rebuilt on every edit, simulating LSP round-trips

style:
  - "No AI attribution in commits, docs, or any public content"
  - "Edition 2024, rust-version 1.93"
  - "No mod.rs — use foo.rs + foo/ style"
  - "No composite type names — use the module path (diagnostic::Style, not DiagnosticStyle)"
  - "No `use foo as bar` aliasing — import the parent module and disambiguate by path"
  - "No unwrap() in library code — expect(\"invariant: ...\") or let ... else"
  - "#![warn(missing_docs)] is on; every public item needs a doc"
  - "iced function helpers (button(text(..))), never Widget::new"
  - "Test names read as sentences, no test_ prefix"
  - "Conventional commits: type(scope): description"

workflow:
  - "Ground truth is the iced source at the pinned rev, never recall. The text/editor APIs were rewritten recently; anything you remember about iced 0.13/0.14 text_editor is wrong."
  - "Phases are ordered 1 → 2 → 3 → 4 → {5, 6} → 7. Phases 5 and 6 are independent."
  - "Decoration geometry runs in draw(), after editor.highlight(..), never in layout() — layout_runs() terminates at the first unshaped line."
  - "Never clone graphics::text::Editor; a second strong Arc panics on the next mutation."
  - "If you find yourself building a second cosmic_text::Buffer, a logical↔visual mapping, or custom hit-testing, stop — that is the virtual-text architecture this project excludes."

# Project tracking: no GitHub milestones, labels, or issues have been created.
# The local handoff + phase docs are self-sufficient. If you want a board,
# ask the repo owner first — creating issues is an outward-facing action.
