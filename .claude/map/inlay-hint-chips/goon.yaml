# Project configuration for /goon and /handoff.
# Generated by /map for the inlay-hint-chips work.
#
# This is a follow-on to .claude/map/code-editor-widget/, which is complete.
# Everything about the project itself — the pinned rev, the tiny-skia test
# renderer, the style rules — is unchanged and duplicated here only so this
# directory stands alone.

project: matcha
description: Inlay hints become opaque chips in a layer above the code, revealed momentarily by the application.

repo: NickelWenzel/matcha
milestone: none
default_branch: master

handoff:
  dir: .claude/map/inlay-hint-chips
  prefix: SESSION_HANDOFF

# Branches onto the completed code-editor-widget work rather than master.
base_branch: code-editor-widget

predecessor:
  plan: .claude/map/code-editor-widget/
  note: >-
    Complete, 29 commits, 68 tests. This plan deliberately reverses one of its
    decisions — that hints may paint over source text — and supersedes one of
    its tests. Read its MAP_PHASE_6.md before starting.

crate:
  name: matcha
  path: "."
  role: "library — the CodeEditor widget"
  edition: "2024"
  rust_version: "1.93"

upstream:
  iced_rev: fa3bae52874274c012a27d4bf11a83c49e1709ae
  iced_checkout: /home/nickel/Programming/repos/iced
  cosmic_text: "hecrj fork, 0.19.0, rev 1cdc3e0fcda67e38946db57df777181e4569d7c0"
  note: >-
    Reach cosmic-text only through iced::advanced::graphics::text::cosmic_text.
    A crates.io cosmic-text is a different crate instance and its types will not
    unify with iced's.

# The test renderer is pinned to tiny-skia in .cargo/config.toml — with wgpu,
# concurrent vkCreateInstance calls segfault the host Vulkan loader. It matters
# more than usual here: this design depends on layer ordering, so the backend
# the tests run on has to be the one whose ordering was verified. Both agree.
checklist:
  quick:
    - cargo test
  verify:
    - cargo test
    - cargo doc --no-deps
  lint:
    - cargo clippy --all-targets -- -D warnings
    - cargo fmt --all -- --check

forbidden:
  - command: cargo run --example <name>
    reason: opens a GUI window and hangs a headless session — visual verification is the human's step
  - command: cargo test -- --ignored
    reason: >-
      snapshot baselines auto-create on first run and return true. Chips change
      what every hint snapshot captures, so a stray run bakes in an unreviewed
      baseline for the very thing this plan changes.
  - command: cargo update / editing the pinned iced rev
    reason: the pin is the contract; upgrades are a deliberate, reviewed step

key_files:
  - .claude/map/inlay-hint-chips/SESSION_HANDOFF.md
  - .claude/map/inlay-hint-chips/MAP_PLAN.md
  - src/code_editor/widget.rs
  - src/code_editor/decoration/inlay.rs
  - .claude/map/code-editor-widget/MAP_PHASE_6.md
  # Upstream reference — ground truth, read rather than recalled
  - /home/nickel/Programming/repos/iced/wgpu/src/lib.rs
  - /home/nickel/Programming/repos/iced/graphics/src/layer.rs
  - /home/nickel/Programming/repos/iced/core/src/padding.rs

examples:
  - command: cargo run --example live
    description: hold the reveal key — chips should hide the code and vanish on release
  - command: cargo run --example showcase
    description: static decorations; the visual smoke test

style:
  - "No AI attribution in commits, docs, or any public content"
  - "No mod.rs — use foo.rs + foo/ style"
  - "No composite type names — use the module path (inlay::Style, not InlayStyle)"
  - "No `use foo as bar` aliasing — import the parent module and disambiguate by path"
  - "No unwrap() in library code"
  - "#![warn(missing_docs)] is on; every public item needs a doc"
  - "iced function helpers, never Widget::new"
  - "Test names read as sentences, no test_ prefix"
  - "Conventional commits: type(scope): description"

workflow:
  - "Ground truth is the iced source at the pinned rev, never recall."
  - "Chips are draw-only. Touching editor.update, perform, State::update, input_method or operate means the design has been broken."
  - "Mutation-test every load-bearing line: break it, confirm a named test fails. Six vacuous tests were caught this way on the predecessor plan, in two shapes — a test that re-derives its expectation from the function under test, and a test whose assertion has more slack than the property it claims."
  - "Padding::horizontal()/vertical() are BUILDERS. The sum accessors are x() and y()."
  - "A chip in the base layer compiles, runs, and is invisible — which is why Probe has to record layer depth before any of this can be verified."
