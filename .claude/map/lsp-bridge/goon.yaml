# Project configuration for /goon and /handoff.
# Generated by /map for the lsp-bridge work.
#
# Follows .claude/map/code-editor-widget/ and .claude/map/inlay-hint-chips/,
# both complete. Everything about the project itself — the pinned rev, the
# tiny-skia test renderer, the style rules — is unchanged and duplicated here
# only so this directory stands alone.

project: matcha
description: >-
  An optional LSP bridge: language-server messages become matcha's own types,
  positions convert between the protocol's encodings and UTF-8 byte offsets,
  and single-document text edits apply to a Content.

repo: NickelWenzel/matcha
milestone: none
default_branch: master
base_branch: master

handoff:
  dir: .claude/map/lsp-bridge
  prefix: SESSION_HANDOFF

predecessor:
  plan: .claude/map/inlay-hint-chips/
  note: >-
    Complete. The chips work established that hints are opaque overlays the
    application reveals; this plan does not revisit that. It does reverse a
    stated non-goal: README.md:98-99 and src/lib.rs:71-80 both say the LSP
    protocol is out of scope. Phase 13 rewrites that prose.

crate:
  name: matcha
  path: "."
  role: "library — the CodeEditor widget, plus the lsp bridge behind a feature"
  edition: "2024"
  rust_version: "1.93"

upstream:
  iced_rev: fa3bae52874274c012a27d4bf11a83c49e1709ae
  iced_checkout: /home/nickel/Programming/repos/iced
  cosmic_text: "hecrj fork, 0.19.0, rev 1cdc3e0fcda67e38946db57df777181e4569d7c0"
  note: >-
    Reach cosmic-text only through iced::advanced::graphics::text::cosmic_text.
    A crates.io cosmic-text is a different crate instance and its types will not
    unify with iced's.

# This feature's whole point is that its dependencies are NOT pinned. The Rust
# LSP type ecosystem is split — lsp-types has been frozen at 0.97 since
# 2024-06-04 while async-lsp pins ^0.95, and gen-lsp-types (what wgsl-analyzer
# uses) ships breaking releases monthly. A permissive range lets Cargo unify on
# whatever the application already resolved. Verified: every struct the bridge
# reads is identical across both ranges, and one source compiles at all six
# versions. Two rules keep it that way; see MAP_PLAN.md "Conversion rules".
lsp_dependencies:
  - crate: lsp-types
    range: ">=0.95, <0.98"
    verified_at: ["0.95.0", "0.96.0", "0.97.0"]
    rule: "read URIs with as_str(); Display is absent on 0.96+"
  - crate: gen-lsp-types
    range: ">=0.9, <0.12"
    verified_at: ["0.9.0", "0.10.0", "0.11.0"]
    rule: "route integer enums through u32::from; 0.11 added Custom(u32)"

# The test renderer is pinned to tiny-skia in .cargo/config.toml — with wgpu,
# concurrent vkCreateInstance calls segfault the host Vulkan loader.
#
# A plain `cargo test` exercises NONE of this feature. The matrix is the point.
#
# The matrix becomes valid in stages. `--features lsp` works from Phase 1;
# `--features lsp-types` only from Phase 9 and `--features gen-lsp-types` only
# from Phase 11, because that is when those features are declared. Before then
# those entries fail with "does not contain this feature" and that is EXPECTED,
# not a regression. `cargo test` alone is the baseline and must stay green
# throughout.
checklist:
  quick:
    - cargo test
    - cargo test --features lsp              # from Phase 1
  verify:
    - cargo test
    - cargo test --features lsp
    - cargo test --features lsp-types        # from Phase 9
    - cargo test --features gen-lsp-types    # from Phase 11
    - cargo test --all-features              # from Phase 11
    - cargo doc --no-deps --all-features
  lint:
    - cargo clippy --all-targets -- -D warnings
    - cargo clippy --all-targets --features lsp -- -D warnings
    - cargo clippy --all-targets --features lsp-types -- -D warnings
    - cargo clippy --all-targets --features gen-lsp-types -- -D warnings
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo fmt --all -- --check

# A permissive range is only honest if every version in it is built. Cargo.lock
# IS tracked, so these run in-repo and each MUST be followed by restoring it.
# This is the one carve-out from "no cargo update" (constraint 7); it never
# touches the iced rev.
range_check:
  # Builds AND lints: missing-doc and dead-code problems here are
  # version-dependent, which is the whole reason the range needs checking.
  - "for v in 0.95.0 0.96.0 0.97.0; do cargo update -p lsp-types --precise $v && cargo clippy --all-targets --features lsp-types -- -D warnings; done; git checkout -- Cargo.lock"
  - "for v in 0.9.0 0.10.0 0.11.0; do cargo update -p gen-lsp-types --precise $v && cargo clippy --all-targets --features gen-lsp-types -- -D warnings; done; git checkout -- Cargo.lock"

forbidden:
  - command: cargo run --example <name>
    reason: opens a GUI window and hangs a headless session — visual verification is the human's step
  - command: cargo test -- --ignored
    reason: >-
      snapshot baselines auto-create on first run and return true
      (iced/test/src/simulator.rs:261-296). No baselines exist yet, so a stray
      run bakes in an unreviewed one. This feature draws nothing, so it has no
      business running them at all.
  - command: cargo update / editing the pinned iced rev
    reason: >-
      The pin is the contract; upgrades are a deliberate, reviewed step.
      ONE carve-out: `cargo update -p lsp-types --precise <0.95.0|0.96.0|0.97.0>`
      and `cargo update -p gen-lsp-types --precise <0.9.0|0.10.0|0.11.0>` are
      permitted, because Phases 9-12 cannot otherwise check their version range.
      Those two package names and those six versions only, each followed by
      `git checkout -- Cargo.lock`. The iced rev is never touched.
  - command: editing src/code_editor/widget.rs or geometry.rs
    reason: >-
      the bridge produces the same Vec the existing setters already take. If a
      phase needs to touch the widget, the design has been broken — stop and report.

key_files:
  - .claude/map/lsp-bridge/SESSION_HANDOFF.md
  - .claude/map/lsp-bridge/MAP_PLAN.md
  - src/lib.rs                       # crate docs; three invariants at :71-110
  - src/code_editor.rs               # module layout and re-exports
  - src/code_editor/content.rs       # pub(super) editor; gains the revision
                                     # counter in Phase 3. apply() lives in lsp/apply.rs
  - src/code_editor/decoration.rs    # TextRange, private fields, ordering ctor
  - Cargo.toml                       # gains the crate's first [features] table
  # Upstream reference — ground truth, read rather than recalled
  - /home/nickel/Programming/repos/iced/core/src/text/editor.rs
  - /home/nickel/Programming/repos/iced/graphics/src/text/editor.rs

examples:
  - command: cargo run --example lsp --features lsp-types
    description: real publishDiagnostics, inlayHint and codeAction payloads
                 through the bridge. 1, 2, 3 deliver them; a applies the action.
                 Edit between 3 and a to see it refused.
  - command: cargo run --example live
    description: hold the reveal key — chips should hide the code and vanish on release
  - command: cargo run --example showcase
    description: static decorations; the visual smoke test

style:
  - "No AI attribution in commits, docs, or any public content"
  - "No mod.rs — use foo.rs + foo/ style"
  - "No composite type names — use the module path (inlay::Style, not InlayStyle).
     This applies to the lsp module too: it is lsp::Hint and lsp::workspace::Edit,
     NOT InlayHint and WorkspaceEdit. See MAP_PLAN.md's naming table for the full
     spec mapping. The single exception is lsp::CodeAction, because matcha::Action
     already exists and means iced's editor action."
  - "No `use foo as bar` aliasing — import the parent module and disambiguate by path"
  - "No unwrap() in library code"
  - "#![warn(missing_docs)] is on; a doc must sit INSIDE the cfg with its item"
  - "iced function helpers, never Widget::new"
  - "Test names read as sentences, no test_ prefix"
  - "Conventional commits: type(scope): description"

workflow:
  - "Ground truth is the iced source at the pinned rev, never recall."
  - "Read MAP_PLAN.md's Divergences section before any phase. Five rules differ
     between the decoration path and the edit path on purpose, and every one of
     them was a bug in an earlier draft."
  - "The widget gains no field and no code path. Content MAY gain fields -- it
     gains a revision counter. The ban is on widget.rs and geometry.rs only."
  - "Edit sort key is (start, end), stable ASCENDING, iterated in REVERSE,
     carrying the original index. Sorting by start alone corrupts text:
     [replace(0..2,'Q'), insert(0,'A')] over 'XYZ' gives 'QYZ', not 'AQZ'. A
     stable DESCENDING sort reverses same-position inserts: '321Z', not '123Z'.
     Both measured."
  - "Reverse order is also required because topmost_line_changed is overwritten
     across performs (iced/graphics/src/text/editor.rs:535), so ascending leaves
     syntax highlighting stale above the last edit."
  - "line == line_count CLAMPS to end of last line (the LSP end-of-document
     idiom; a whole-file format is one edit over 0:0..lineCount:0). line >
     line_count PASSES THROUGH unconverted on the decoration path -- clamping it
     paints a false squiggle, because range_fragments widens a zero-width range
     (geometry.rs:56-80), and it breaks lib.rs:102-110. On the edit path it errors."
  - "A RANGE is dropped whole when EITHER endpoint's line is past the buffer.
     The pass-through rule above is per POSITION; a live start with a stale end
     would otherwise squiggle from the start to EOF, because range_fragments
     filters runs to [start.line, end.line]. Bridge::range returns Option for
     exactly this."
  - "Line endings: split new_text on \r\n|\n|\r and rejoin with the target.
     When the target is unknown -- line_ending() returns None, OR returns
     Some(LineEnding::None) (a distinct case), which every single-line buffer
     does, including Content::new() -- 
     do NOT normalize at all. Defaulting to Lf rewrites a DOS file's \r\n and silently converts it."
  - "Bridge::clamp rounds a mid-character column DOWN; Bridge::exact returns
     None. Applying the decoration policy on the edit path silently widens the
     replaced range."
  - "Content::apply goes through Bridge::resolve, NOT exact. `exact` discards
     the reason, and apply needs it to build Error::LineOutOfBounds /
     ColumnOutOfBounds / NotACharBoundary. An agent that reaches for `exact`
     cannot build those variants."
  - "Content::apply must not hold a Bridge or any Ref across its own
     self.0.borrow_mut(). RefCell::borrow_mut takes &self, so the borrow checker
     permits it and the panic is at runtime. External callers are safe -- that
     case is E0502. The hazard is confined to apply itself."
  - "URI accessors are OPPOSITE between the two crates: as_str() for lsp-types
     (no Display on 0.96+), to_string() for gen-lsp-types (no inherent as_str).
     Both measured."
  - "gen-lsp-types integer enums go through u32::from, never an exhaustive
     match -- 0.11 added Custom(u32)."
  - "Conversions run BOTH directions. data/code/source/tags exist for echo-back,
     which is impossible inbound-only."
  - "position_anchor returning None means 'not drawable now', NOT 'stale' -- it
     also returns None for a valid line scrolled off screen."
  - "Editor::overwrite is a trap: no topmost_line_changed (stale colours) and no
     recorded Change (a later undo panics on stale cursors)."
  - "Mutation-test every load-bearing line: break it, confirm a NAMED test fails.
     Six vacuous tests were caught this way on a predecessor plan."
